---
# provision_vm.yml — per-VM tasks, executed with `vm` in scope.

- name: "({{ vm.name }}) Define per-VM variables"
  ansible.builtin.set_fact:
    vm_hostname: "{{ kvm_vm_hostname_prefix | default('') }}{{ vm.name }}"
    vm_disk_path: "{{ kvm_image_cache_dir }}/{{ vm.name }}.qcow2"
    vm_userdata_path: "{{ kvm_cloudinit_dir }}/{{ vm.name }}-user-data"
    vm_metadata_path: "{{ kvm_cloudinit_dir }}/{{ vm.name }}-meta-data"

- name: "({{ vm.name }}) Create overlay disk backed by the cloud image"
  ansible.builtin.command:
    cmd: >
      qemu-img create -f qcow2 -F qcow2
      -b {{ kvm_image_cache_dir }}/{{ kvm_cloud_image_name }}
      {{ vm_disk_path }} {{ kvm_vm_disk_gb }}G
    creates: "{{ vm_disk_path }}"
  become: true

- name: "({{ vm.name }}) Render cloud-init meta-data"
  ansible.builtin.template:
    src: meta-data.j2
    dest: "{{ vm_metadata_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  vars:
    vm_ip: "{{ vm.ip }}"
    vm_mac: "{{ vm.mac }}"

- name: "({{ vm.name }}) Render cloud-init user-data"
  ansible.builtin.template:
    src: user-data.j2
    dest: "{{ vm_userdata_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  vars:
    vm_ip: "{{ vm.ip }}"
    vm_mac: "{{ vm.mac }}"

- name: "({{ vm.name }}) Build cloud-init seed ISO"
  ansible.builtin.command:
    cmd: >
      genisoimage -output {{ kvm_cloudinit_dir }}/{{ vm.name }}-seed.iso
      -volid cidata -joliet -rock
      {{ vm_userdata_path }} {{ vm_metadata_path }}
    creates: "{{ kvm_cloudinit_dir }}/{{ vm.name }}-seed.iso"
  become: true

- name: "({{ vm.name }}) Define the VM in libvirt"
  community.libvirt.virt:
    name: "{{ vm.name }}"
    command: define
    xml: "{{ lookup('ansible.builtin.template', 'vm.xml.j2') }}"
  become: true
  vars:
    vm_ip: "{{ vm.ip }}"
    vm_mac: "{{ vm.mac }}"

- name: "({{ vm.name }}) Ensure the VM is running"
  community.libvirt.virt:
    name: "{{ vm.name }}"
    state: running
  become: true
