---
# Defaults for node_hardening.

hardening_disable_swap: true
hardening_swapfile_path: /swap.img

hardening_kernel_modules:
  - overlay
  - br_netfilter

hardening_sysctl:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.all.send_redirects: 0
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1

# UFW
hardening_ufw_enabled: true
hardening_ufw_default_incoming: deny
hardening_ufw_default_outgoing: allow
hardening_ufw_allow_rules:
  - { port: 22,    proto: tcp, comment: "SSH" }

# SSH (applied only when the key exists on the target)
hardening_ssh_port: 22
hardening_ssh_permit_root_login: "no"
hardening_ssh_password_authentication: "no"
hardening_ssh_x11_forwarding: "no"
hardening_ssh_max_auth_tries: 3
hardening_ssh_client_alive_interval: 300
hardening_ssh_client_alive_count: 2
