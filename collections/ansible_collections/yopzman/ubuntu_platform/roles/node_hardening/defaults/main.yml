---
# Defaults for node_hardening.

node_hardening_disable_swap: true
node_hardening_swapfile_path: /swap.img

node_hardening_kernel_modules:
  - overlay
  - br_netfilter

node_hardening_sysctl:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.all.send_redirects: 0
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1

# UFW
node_hardening_ufw_enabled: true
node_hardening_ufw_default_incoming: deny
node_hardening_ufw_default_outgoing: allow
node_hardening_ufw_allow_rules:
  - port: 22
    proto: tcp
    comment: SSH

# SSH (applied only when the key exists on the target)
node_hardening_ssh_port: 22
node_hardening_ssh_permit_root_login: "no"
node_hardening_ssh_password_authentication: "no"
node_hardening_ssh_x11_forwarding: "no"
node_hardening_ssh_max_auth_tries: 3
node_hardening_ssh_client_alive_interval: 300
node_hardening_ssh_client_alive_count: 2
