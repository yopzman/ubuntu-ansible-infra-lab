---
# swap.yml — disable swap at runtime and persistently.

- name: Find active swap devices
  ansible.builtin.shell: |
    set -o pipefail
    swapon --show=NAME --noheadings | grep -v '^$' || true
  args:
    executable: /bin/bash
  register: node_hardening_active_swap
  changed_when: false

- name: Disable all active swap
  ansible.builtin.command:
    cmd: "swapoff {{ item }}"
  loop: "{{ node_hardening_active_swap.stdout_lines }}"
  when: node_hardening_active_swap.stdout_lines | length > 0
  register: node_hardening_swapoff_result
  changed_when: node_hardening_swapoff_result.rc == 0

- name: Remove swap entries from /etc/fstab
  ansible.posix.mount:
    name: "{{ node_hardening_swapfile_path }}"
    fstype: swap
    state: absent

- name: Remove any remaining swap lines from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#\s]+\s+\S+\s+swap\s'
    state: absent
    backup: true
