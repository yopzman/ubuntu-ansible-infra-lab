---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling and collections
        run: |
          pip install ansible-core ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      # ansible-lint runs syntax checks with cwd inside playbooks/, where the
      # relative paths in ansible.cfg don't resolve — point it at the repo.
      - name: ansible-lint
        run: ansible-lint
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles

      - name: Syntax-check all playbooks
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: |
          for pb in playbooks/*.yml; do
            echo "::group::ansible-playbook --syntax-check $pb"
            ansible-playbook "$pb" --syntax-check
            echo "::endgroup::"
          done
